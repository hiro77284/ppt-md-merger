# typst_semantic_engine.yaml
# engine: typst のときの pandoc 既定設定（パッケージ同梱）。pandoc.typstdefaults を
# 省略したときに使う。文書ごとの上書きは、この後ろに続けて指定する defaults で行う
# （-d は後勝ちでマージ）。
#
# LaTeX 用の report_semantic_engine.yaml と同じセマンティックフィルタを使う。
# pandoc-crossref は使わない（図・表の番号は使っていない。docs/design_typst_migration.md §2.3）。
# ページ設計（フォント・余白・見出し・柱・目次・表紙）は report_style.typ、
# セマンティック記法の見た目は semantic_macros.typ（この順で読む）。
standalone: true
template: report_template.typst
toc: true
toc-depth: 3
number-sections: false
# gfm_auto_identifiers: 見出し ID を GitHub と同じ規則で付ける（先頭の章番号「5) 」も ID に残る）。
# ノートや README の [..](#5-requirements--quick-start) 形式のリンクがそのまま解決する。
# pandoc 既定の規則だと番号が落ちて typst が「label does not exist」で止まる。
from: markdown-implicit_figures+gfm_auto_identifiers
filters:
  - include-files-resource-path.lua
  - blockindent.lua
  - largefontblock.lua
  - keep-together.lua
  - divboxes.lua
  - center.lua
  - semantic-spans.lua
  - semantic-leaf.lua
  - semantic-break.lua
include-in-header:
  - semantic_macros.typ
  - report_style.typ
metadata:
  lang: ja
