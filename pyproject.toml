[project]
name = "pptmdmerge"
version = "0.8.0"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "Pillow>=10.0",
    "pymupdf>=1.23",
    "python-pptx>=0.6",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.scripts]
pptmdmerge = "md_merge.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
md_merge = ["filters/*.lua", "templates/*.tex"]
