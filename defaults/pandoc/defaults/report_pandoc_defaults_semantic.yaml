pdf-engine: lualatex
standalone: true

# 画像名があるときに採番する Figure 環境を抑制
from: markdown-implicit_figures

# 目次を作る設定
toc: true
toc-depth: 3
# toc-title: 目次

# テンプレ指定
# template: report_template.tex

number-sections: false

filters:
  - pandoc-crossref
  - include-files-resource-path.lua
  - blockindent.lua
  - largefontblock.lua
  - keep-together.lua
  - divboxes.lua
  - dump-sections.lua
  - center.lua
  - semantic-spans.lua
  - semantic-leaf.lua
  - semantic-break.lua

# インライン span（[x]{.term} 等）の LaTeX マクロ定義。xcolor は未読込なら自動ロード。
include-in-header:
  - semantic_macros.tex


metadata:
  fontsize: 11pt
  secPrefix:
    - ""
    - ""
  figureTitle: "図"
  titleDelim: "："
  figPrefix: ["図", "図"]
  tblPrefix: ["表", "表"]
  eqnPrefix: ["式", "式"]


variables:
  documentclass: report
  mainfont: "BIZ UDPMincho"
  sansfont: "BIZ UDPGothic"
  monofont: "Consolas"
  geometry:
    - top=15mm
    - headheight=14pt
    - headsep=8mm
    - bottom=15mm
    - left=20mm
    - right=20mm

