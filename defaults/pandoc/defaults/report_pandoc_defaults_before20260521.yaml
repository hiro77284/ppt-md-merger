pdf-engine: lualatex
standalone: true

# 目次を作る設定
toc: true
toc-depth: 3
# toc-title: 目次

# テンプレ指定
# template: report_template.tex

# include-in-header:
#   - report_header.tex

number-sections: false

filters:
  - pandoc-crossref
  - include-files-resource-path.lua
  - blockindent.lua
  - largefontblock.lua
  - keep-together.lua
  - divboxes.lua
  - dump-sections.lua


# resource-path はレシピの pandoc セクション（resource-path）で指定する

metadata:
  fontsize: 11pt
  secPrefix:
    - ""
    - ""
  figureTitle: "図"
  titleDelim: "："
  figPrefix: ["図", "図"]
  tblPrefix: ["表", "表"]
  eqnPrefix: ["式", "式"]


variables:
  documentclass: report
  mainfont: "BIZ UDPMincho"
  sansfont: "BIZ UDPGothic"
  monofont: "Consolas"
  geometry:
    - top=15mm
    - headheight=14pt
    - headsep=8mm
    - bottom=15mm
    - left=20mm
    - right=20mm

