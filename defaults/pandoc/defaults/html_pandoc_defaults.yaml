standalone: true

css:
  - ${.}/../html_style.css

# 目次を作る設定
toc: true
toc-depth: 3
# toc-title: 目次

filters:
  - back-to-top.lua
  - pandoc-crossref
  - include-files-resource-path.lua

# resource-path はレシピの pandoc セクション（resource-path）で指定する

metadata:
  secPrefix:
    - ""
    - ""
  figureTitle: "図"
  titleDelim: "："
  figPrefix: ["図", "図"]
  tblPrefix: ["表", "表"]
  eqnPrefix: ["式", "式"]


