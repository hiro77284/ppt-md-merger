version: 2
_constants: ../constants_settings.toml
# MD, PowerPointファイルの結合指示書のサンプル
output: 
  pptxfilename: delete_csl_merged.pptx        # 結合後のpptxファイル名

indexer:
  deletecsl: true  # pptmerge 時に #CSL# マーカーのあるスライドを削除するかどうか。デフォルトはfalse。 --deletecsl オプションで上書きされる
  pptxnumbering: no       # pptmerge での章節番号付番方法。chapt_section の場合、idresolve を使わずに pptx 単独で chapter, section 操作により 章・節番号を付番する

input:
  dirs: 
    - .
    - extracted
    - ../../defaults/common_assets

procedure:
  - insertpptx: delete_csl_guide.pptx
  - insertpptx: delete_csl_sample1.pptx
