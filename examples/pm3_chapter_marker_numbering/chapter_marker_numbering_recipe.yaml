version: 2
_constants: ../constants_settings.toml
# MD, PowerPointファイルの結合指示書のサンプル

output: 
  pptxfilename: chapter_marker_numbering_merged.pptx        # 結合後のpptxファイルのファイル名

indexer:
  pptxnumbering: chapt_section       # pptmerge での章節番号付番方法。chapt_section の場合、idresolve を使わずに pptx 単独で chapter, section 操作により 章・節番号を付番する

input:
  dirs: 
    - .
    - extracted
    - ../../defaults/common_assets

procedure:
  - insertpptx: chapter_marker_numbering_guide.pptx

  - insertpptx: chapter_marker_numbering_sample.pptx
