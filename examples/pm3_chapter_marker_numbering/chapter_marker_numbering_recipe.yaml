# MD, PowerPointファイルの結合指示書のサンプル

output: 
  pptxfilename: chapter_marker_numbering_merged.pptx        # 結合後のpptxファイルのファイル名

indexer:
  pptxnumbering: chapt_section       # pptmerge での章節番号付番方法。chapt_section の場合、idresolve を使わずに pptx 単独で operation: chapter, operation:section により 章・節番号を付番する

input:
  dirs: 
    - .
    - extracted
    - ../../defaults/common_assets

procedure:
  - operation: insertpptx
    pptxfilename: chapter_marker_numbering_guide.pptx

  - operation: insertpptx
    pptxfilename: chapter_marker_numbering_sample.pptx
