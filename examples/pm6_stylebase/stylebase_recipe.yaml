# PowerPointファイル結合指示サンプル

# 概要：stylebase を分離指定して結合する

# 出力ファイル名
output: 
  pptxfilename: stylebase_merged.pptx        # 結合後のpptxファイルのファイル名

pptmerge:
  stylebase: simple_stylebase.pptx           # stylebase として使用する pptx ファイルのパス

input:
  dirs: 
    - .
    - extracted
    - ../../defaults/common_assets

# 結合手順： "operation: insertpptx" で、結合したいファイルを結合順に記載する
procedure:
  - operation: insertpptx
    pptxfilename: stylebase_guide.pptx

  - operation: insertpptx
    pptxfilename: different_style_sample.pptx
