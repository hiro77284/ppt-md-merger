version: 4
_constants: ../../constants_settings.toml
# PowerPointファイル結合指示サンプル

# 概要：stylebase を分離指定して結合する

# 出力ファイル名
output: 
  outputdir: ../build  # 出力ファイルを書き込むディレクトリ
  pptxfilename: stylebase_merged.pptx        # 結合後のpptxファイルのファイル名

pptmerge:
  stylebase: simple_stylebase.pptx           # stylebase として使用する pptx ファイルのパス

input:
  dirs: 
    - .
    - ../mds
    - ../../../user_settings/common_assets

# 結合手順： "- insertpptx: ファイル名" で、結合したいファイルを結合順に記載する
procedure:
  - insertpptx: stylebase_guide.pptx

  - insertpptx: different_style_sample.pptx
