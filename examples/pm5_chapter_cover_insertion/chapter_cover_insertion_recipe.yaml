version: 2
_constants: ../constants_settings.toml
# MD, PowerPointファイルの結合指示書のサンプル

output: 
  pptxfilename: chapter_cover_insertion_merged.pptx        # 結合後のpptxファイルのファイル名

indexer:
  pptxnumbering: chapt_section       # pptmerge での章節番号付番方法。chapt_section の場合、idresolve を使わずに pptx 単独で chapter, section 操作により 章・節番号を付番する
  deletecsp: true

input:
  dirs: 
    - .
    - extracted
    - ../../defaults/common_assets

procedure:
  - chapter: "+"
  - insertpptx: chapter_cover_insertion_guide.pptx

  - insertpptx: chaptercover_withdetailguide.pptx
    vars:
      CHAPT_TITLE: 章カバーサンプル(その１)
  - insertpptx: no_contents.pptx

  - insertpptx: chaptercover_withdetailguide.pptx
    vars:
      CHAPT_TITLE: 章カバーサンプル(その２)
  - insertpptx: no_contents.pptx
