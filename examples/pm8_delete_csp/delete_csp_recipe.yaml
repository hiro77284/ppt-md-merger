version: 1
!constants ../constants_settings.toml
# MD, PowerPointファイルの結合指示書のサンプル
output: 
  pptxfilename: delete_csp_merged.pptx        # 結合後のpptxファイル名

indexer:
  deletecsp: true  # pptmerge 時に #CSP# マーカーのあるシェイプを削除するかどうか。デフォルトはfalse。 --deletecsp オプションで上書きされる
  pptxnumbering: no       # pptmerge での章節番号付番方法。chapt_section の場合、idresolve を使わずに pptx 単独で operation: chapter, operation:section により 章・節番号を付番する

input:
  dirs: 
    - .
    - extracted
    - ../../defaults/common_assets

procedure:
  - operation: insertpptx
    pptxfilename: delete_csp_guide.pptx
    slides: [1,2,3,5,7]
