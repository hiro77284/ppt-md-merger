# MD, PowerPointファイルの結合指示書のサンプル
version: 4

vars: # mdファイルとpptxファイルの双方で変数置換に使用する変数の定義
  _include: ../COVER_VARS.yaml  # 表紙用変数は別ファイルから読み込む

log:
  level: debug
  filename: log.txt
  duplicate: stdout  # ログファイルと同じ内容を標準出力または標準エラーにも出す。未設定または空欄のときは重複出力しない。stdout は標準出力、stderr は標準エラー出力
  dir: build  # ログファイルを書き込むディレクトリ（filename がファイルのとき）

# puremd サブコマンドのオプション。削除対象とするパターンを指定するyamlファイルのパス
puremd:
  strip_config: ../../../user_settings/common_assets/puremd_strip.yaml
  description: common_assets に入れてある

# 出力ファイル名設定
output: 
  force: true          # 既存の出力ファイルを上書きする（既定: false）
  outputdir: ../build  # 出力ファイルを書き込むディレクトリ
  targetbasefilename: readme_file_target

  mdfilename:             # 結合後のmdファイルのファイル名
  pptxfilename:         # 結合後のpptxファイルのファイル名
  idcollectfilename:   # 結合後のmdファイルから{{#id:...}}マーカーを抽出して生成されるインベントリファイルのファイル名
  idresolvedfilename:   # インベントリファイルを読み込んでnumberとlabelを付与したID解決済みマップファイルのファイル名
  renderedfilename:     # 結合後のmdファイルに対してタイトル置換・参照置換を行ったrender済みmdファイルのファイル名
  puremdfilename:         # rendered.mdファイルからlatex命令を削除した純粋なmdファイルのファイル名。MD自体でプレビューを見るときはこれを使う
  pdffilename:           # 結合後のmdファイルをPandocでレンダーして生成されるpdfファイルのファイル名
  htmlfilename:         # 結合後のmdファイルをPandocでレンダーして生成されるhtmlファイルのファイル名
  revealfilename:         # 結合後のmdファイルをPandocでレンダーして生成されるhtmlファイルのファイル名

indexer:
  delimiter: '.'
  separator: ') '
  deletecsl: true  # pptmerge 時に #CSL# マーカーのあるスライドを削除するかどうか。デフォルトはfalse。 --deletecsl オプションで上書きされる
  deletecsp: true  # pptmerge 時に #CSP# マーカーのあるシェイプを削除するかどうか。デフォルトはfalse。 --deletecsp オプションで上書きされる
  pptxnumbering: no       # pptmerge での章節番号付番方法。chapt_section の場合、idresolve を使わずに pptx 単独で chapter, section 操作により 章・節番号を付番する

# merge サブコマンドのオプション
merge:
  copy-images: true # falseなら画像ファイルのコピーおよびパス書き換えを行わない。（既定値 true は画像ファイルのコピーおよびパス書き換えを行う。旧キー no-copy-images も可）
  image-dir: images         # 画像コピー先サブディレクトリ名（既定: 空値。結合後のmdファイルでもソースのmdファイルの相対パスを維持するように画像ファイルをコピーする）
  flatten-images: true # trueならすべての画像を<outputdir>/<image-dir>/ にフラット集約する。同名ファイルは _1, _2 … のサフィックスを付けて上書きを回避する（既定: false）
  strict: false         # 警告をエラーとして扱う（既定: false）


transfer:
  dataentry_input: ../../../  # 出力先（必須）
  slug: readme-images          # 必須。画像を置くサブフォルダ名と出力 MD 名になる（英小文字・数字・-）
  inputmd: readme_file_target_github.md         # 省略すると output.renderedfilename を使う
  outputmd: README.md     # 省略すると {slug}.md
  image_naming: sanitize  # 既定は preserve（元のファイル名のまま）
  image_collision: overwrite  # 既定は rename（_1, _2 の連番）

pandoc: 
  data-dir: ../../../user_settings/pandoc

  # ↓PDF の表紙。書いたときだけ表紙が付く。
  # 名前だけ書くと同梱の templates/ を探す（cover_standard.md は COVER_* を使う標準の表紙）。
  # HTML の表紙は htmlcover: に書く（例: htmlcover: standard_cover.html）。
  # cover-md: cover_standard.md

  # 画像などを探しに行く基準ディレクトリ（PDF）。HTML では処理しない。YAMLリストで複数指定可能
  # 相対パス指定時は recipe.yaml が基点になる。 data-dir ではないので注意。
  # ↓↓↓↓↓↓
  resource-path: 
    - ../build
    - ../../../user_settings/common_assets

  syntax-highlighting: tango

#  format: tex

input:
  dirs: 
    - .
    - ../mds
    - ../../../user_settings/common_assets

  imagesdir: 
    - ../images
    - ../../../user_settings/common_assets

  # pptxから画像を取得してくるための設定
  cropsrc:
    pptx: ../src/readme_file.pptx           # 画像のソースとなる pptx ファイル名
    pdf: ../temppdfs/readme_file.pdf           # スライド全体画像取得用のPDF

# 結合手順： "- insertpptx: ファイル名" で、結合したいファイルを結合順に記載する
procedure:
  - insertmdpages: readme_file_slide[1-5].md

