  - insertvspace: 2
  - insertmd: ppt_md_merger_overview_slide9_md.md
  # yaml-language-server-disable
  __NEWPAGE__

  # yaml-language-server-disable
  - insertmd: ppt_md_merger_overview_slide10_md.md
  # yaml-language-server-disable
  __NEWPAGE__

  # yaml-language-server-disable
