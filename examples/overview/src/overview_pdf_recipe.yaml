    vars:
      CHAPT_TITLE: 問題構造の整理と解決策
  - insertpptx: ppt_md_merger_overview.pptx
    slides: 6-11

  - chapter: "+"
    title: 問題構造の整理と解決策
  - insertmd: ppt_md_merger_overview_slide6_md.md
  - insertmd: ppt_md_merger_overview_slide7_md.md
