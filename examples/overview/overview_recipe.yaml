  - operation: insertmd
    mdfilename: ../../defaults/common_assets/tex_newpage.md
    description: "ページ送り"

  - operation: insertmd
    mdfilename: ppt_md_merger_overview_slide3_md.md
  - operation: insertmd
    mdfilename: ../../defaults/common_assets/tex_newpage.md
    description: "ページ送り"

  - operation: insertmd
    mdfilename: ../../defaults/common_assets/tex_newpage.md
  - operation: insertmd
    mdfilename: ppt_md_merger_overview_slide4_md.md
  - operation: insertmd
    mdfilename: ../../defaults/common_assets/tex_2line.md
  - operation: insertmd
    mdfilename: ppt_md_merger_overview_slide5_md.md


  - operation: insertpptx
    pptxfilename: ../../defaults/common_assets/simple_chaptercover.pptx
    vars:
      CHAPT_TITLE: 問題構造の整理と解決策
  - operation: insertpptx
