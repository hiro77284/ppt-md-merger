    title: PPT & MD merger とは？
  - operation: insertmd
    mdfilename: ppt_md_merger_overview_slide1_md.md

  - operation: insertpptx
    pptxfilename: ../../defaults/common_assets/simple_chaptercover.pptx
    vars:
      CHAPT_TITLE: 大きなPowerPointファイルを作る時の悩みとは？
