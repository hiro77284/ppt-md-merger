  - operation: chapter
    chapter: "+"
    title: 問題構造の整理と解決策
  - operation: insertmd
    mdfilename: ppt_md_merger_overview_slide6_md.md
  - operation: insertmd
    mdfilename: ppt_md_merger_overview_slide7_md.md
  - operation: insertmd
    mdfilename: ../../defaults/common_assets/tex_2line.md
  - operation: insertmd
    mdfilename: ppt_md_merger_overview_slide8_md.md
  - operation: insertmd
    mdfilename: ../../defaults/common_assets/tex_2line.md
  - operation: insertmd
    mdfilename: ppt_md_merger_overview_slide9_md.md
  - operation: insertmd
