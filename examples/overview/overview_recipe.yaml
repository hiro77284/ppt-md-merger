# MD, PowerPointファイルの結合指示書のサンプル
version: 1
# yaml-language-server-disable
!constants ../constants_settings.toml

vars: # mdファイルとpptxファイルの双方で変数置換に使用する変数の定義
  !include COVER_VARS.yaml    # 表紙用変数は別ファイルから読み込む

log:
  level: debug
  filename: log.txt
  duplicate: stdout  # ログファイルと同じ内容を標準出力または標準エラーにも出す。未設定または空欄のときは重複出力しない。stdout は標準出力、stderr は標準エラー出力
  dir: build  # ログファイルを書き込むディレクトリ（filename がファイルのとき）

# puremd サブコマンドのオプション。削除対象とするパターンを指定するyamlファイルのパス
puremd:
  strip_config: ../../defaults/common_assets/puremd_strip.yaml
  description: common_assets に入れてある

# pptmergeコマンドの設定
pptmerge:
  stylebase: ../../defaults/common_assets/simple_stylebase.pptx
  description: pptxをmergeする際にスタイル情報を揃えるベースとなるファイル。スライドの中身は削除され、スタイル情報のみが使われる。マージ対象のpptxから全スライドを削除したものをここに置いてもよい。


# 出力ファイル名設定
output: 
  force: true          # 既存の出力ファイルを上書きする（既定: false）
  outputdir: build  # 出力ファイルを書き込むディレクトリ
  targetbasefilename: overview_merged

  mdfilename:             # 結合後のmdファイルのファイル名
  pptxfilename:         # 結合後のpptxファイルのファイル名
  idcollectfilename:   # 結合後のmdファイルから{{#id:...}}マーカーを抽出して生成されるインベントリファイルのファイル名
  idresolvedfilename:   # インベントリファイルを読み込んでnumberとlabelを付与したID解決済みマップファイルのファイル名
  renderedfilename:     # 結合後のmdファイルに対してタイトル置換・参照置換を行ったレンダー済みmdファイルのファイル名
  puremdfilename:         # rendered.mdファイルからlatex命令を削除した純粋なmdファイルのファイル名。MD自体でプレビューを見るときはこれを使う
  pdffilename:           # 結合後のmdファイルをPandocでレンダーして生成されるpdfファイルのファイル名
  texfilename:           # 結合後のmdファイルをPandocでレンダーして生成されるtexファイルのファイル名
  resourcepathfilename:  # 結合後のmdファイルで使用するリソースパスを書き込むtexファイルのファイル名
  htmlfilename:         # 結合後のmdファイルをPandocでレンダーして生成されるhtmlファイルのファイル名
  revealfilename:         # 結合後のmdファイルをPandocでレンダーして生成されるhtmlファイルのファイル名

indexer:
  delimiter: '.'
  separator: ') '
  deletecsl: true  # pptmerge 時に #CSL# マーカーのあるスライドを削除するかどうか。デフォルトはfalse。 --deletecsl オプションで上書きされる
  deletecsp: true  # pptmerge 時に #CSP# マーカーのあるシェイプを削除するかどうか。デフォルトはfalse。 --deletecsp オプションで上書きされる
  pptxnumbering: idresolve       # pptmerge での章節番号付番方法。chapt_section の場合、idresolve を使わずに pptx 単独で operation: chapter, operation:section により 章・節番号を付番する

# merge サブコマンドのオプション
merge:
  no-copy-images: false # trueなら画像ファイルのコピーおよびパス書き換えを行わない。（既定値 false は画像ファイルのコピーおよびパス書き換えを行う）
  image-dir: figures         # 画像コピー先サブディレクトリ名（既定: 空値。結合後のmdファイルでもソースのmdファイルの相対パスを維持するように画像ファイルをコピーする）
  flatten-images: true # trueならすべての画像を<outputdir>/<image-dir>/ にフラット集約する。同名ファイルは _1, _2 … のサフィックスを付けて上書きを回避する（既定: false）
  strict: false         # 警告をエラーとして扱う（既定: false）


pandoc: 
  !include ../standard_pandocsettings.yaml

#  format: tex

input:
  dirs: 
    - .
    - extracted
    - ../../defaults/common_assets

  imagesdir: 
    - extracted/figures
    - ../../defaults/common_assets

  # pptxから画像を取得してくるための設定
  cropsrc:
    pptx: src/ppt_md_merger_overview.pptx           # 画像のソースとなる pptx ファイル名
    pdf: src/ppt_md_merger_overview.pdf           # スライド全体画像取得用のPDF

# 結合手順： "operation: insertpptx" で、結合したいファイルを結合順に記載する
procedure:
  - operation: insertpptx
    pptxfilename: ../../defaults/common_assets/simple_chaptercover.pptx
    vars:
      CHAPT_TITLE: PPT & MD merger とは？
  - operation: insertpptx
    pptxfilename: src/ppt_md_merger_overview.pptx
    slides: 1
