# constants_settings.toml
# examples_work 共通の特殊定数定義ファイル
#
# 書式: TOML (https://toml.io/)
# 使い方: recipe yaml の先頭付近に以下を記述する
#   _constants: ../constants_settings.toml
#
# 定数の種類:
#   インライン定数 — 改行なし。行中の任意の位置で置換される
#   複数行定数     — 改行あり。その定数だけが書かれた行全体を置換する
#
# 優先順位（低→高）: 組み込み(__DATE__等) < --constants CLI < _constants ファイル
# 同名定数は高優先度で上書きされる。

# ─── プロジェクト情報（インライン定数）────────────────────────────────────────

__ORGANIZATION__ = '株式会社サンプル'
__AUTHOR__       = '山田太郎'
__VERSION__      = '1.0.0'
__REVISION__     = 'Rev.A'

# ─── 出力先・ビルド設定（インライン定数）─────────────────────────────────────


# ─── 複数行定数（行まるごと置換）─────────────────────────────────────────────
# シングルクォート ''' ''' でバックスラッシュをそのまま書ける
#
# procedure 用の定数（__NEWPAGE__ / __VSPACE1__〜__VSPACE3__ / __VFILL__）は、
# レシピの procedure に並んだときに md の insert 文とはっきり区別できるよう
# 大文字の特殊定数にしている。中身は semantic 記法の procedure なので
# Typst/LaTeX どちらのエンジンでも使える。

# ページ送り（{{pagebreak}}）
__NEWPAGE__ = '''
- insertpagebreak:
  description: "ページ送り"
'''

# 1行送り（{{vspace:1}}）
__VSPACE1__ = '''
- insertvspace: 1
  description: "1行送り"
'''

# 2行送り（{{vspace:2}}）
__VSPACE2__ = '''
- insertvspace: 2
  description: "2行送り"
'''

# 3行送り（{{vspace:3}}）
__VSPACE3__ = '''
- insertvspace: 3
  description: "3行送り"
'''

# 残り高を埋める（{{vfill}}）
__VFILL__ = '''
- insertvfill:
  description: "残り高を埋める"
'''
